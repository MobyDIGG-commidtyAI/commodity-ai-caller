[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-ai-caller"
version = "0.1.0"
description = "Daily commodity data collection and assessment refresh"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4",
    "datasketch",
    "feedparser",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "pyyaml",
    "requests",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
